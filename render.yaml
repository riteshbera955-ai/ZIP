services:
  - type: web
    name: permanent-zip-duplicate-checker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    disk:
      name: zip-checker-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATA_DIR
        value: /var/data
